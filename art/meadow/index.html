<title>GM Grass Meadow</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
  /* Layout: the meadow fills the screen; one floating card (top-left) holds wind and density controls. */
  :root {
    --sky: #b9d8ee;
    --ink: #22301f;
    --muted: #5e6b56;
    --card: rgba(251, 247, 236, 0.9);
    --line: rgba(34, 48, 31, 0.14);
    --accent: #3f8a3a;
    --accent-ink: #ffffff;
    --storm: #45607a;
    --display: "Cinzel", "Trajan Pro", Georgia, serif;
    --body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ink: #eef2e6; --muted: #aab6a1; --card: rgba(22, 29, 24, 0.88); --line: rgba(238, 242, 230, 0.16);
      --accent: #8fd07f; --accent-ink: #10220e; --storm: #9db8d4; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --ink: #eef2e6; --muted: #aab6a1; --card: rgba(22, 29, 24, 0.88); --line: rgba(238, 242, 230, 0.16);
    --accent: #8fd07f; --accent-ink: #10220e; --storm: #9db8d4; color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    background: var(--sky); color: var(--ink); font-family: var(--body); overflow: hidden;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  .card {
    position: fixed; z-index: 2;
    top: calc(env(safe-area-inset-top, 0px) + 12px);
    left: max(16px, env(safe-area-inset-left, 0px));
    width: min(290px, calc(100vw - 32px));
    display: grid; gap: 12px; padding: 14px 16px 16px;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 10px 30px rgba(20, 40, 20, 0.18);
  }
  h1 { margin: 0; font: 700 1.1rem/1.15 var(--display); letter-spacing: 0.04em; }
  .sub { margin: 2px 0 0; font-size: 0.78rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .group { display: grid; gap: 6px; }
  .label { display: flex; justify-content: space-between; font-size: 0.68rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .label output { letter-spacing: 0.04em; color: var(--ink); }
  input[type="range"] { width: 100%; accent-color: var(--accent); margin: 0; }
  .ticks { display: flex; justify-content: space-between; font-size: 0.7rem; color: var(--muted); }
  .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 7px 6px; cursor: pointer; font: 600 0.8rem var(--body); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .seg button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { margin: 0; font-size: 0.74rem; line-height: 1.45; color: var(--muted); }
  .bump { display: inline-block; animation: bump 0.35s ease-out; }
  @keyframes bump { 40% { transform: scale(1.45); color: var(--accent); } }
  @media (prefers-reduced-motion: reduce) { .bump { animation: none; } }
  /* The dock along the bottom: what a click does (Walk / Clear / Plot), plot size and progress, and the Pick Up prompt
     that shows while the hero stands by a log. */
  .dock {
    position: fixed; z-index: 3; left: 50%; transform: translateX(-50%);
    bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: max-content; max-width: calc(100vw - 32px); pointer-events: none;
  }
  .dock > * { pointer-events: auto; }
  .dock .seg, .plotbar {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); box-shadow: 0 8px 24px rgba(20, 40, 20, 0.22);
  }
  .toolbar button { padding: 9px 14px; font-size: 0.86rem; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .dock kbd { font: 700 0.68rem var(--body); padding: 0 5px; border: 1px solid var(--line); border-radius: 5px; color: var(--muted); }
  .dock button[aria-pressed="true"] kbd { color: inherit; border-color: currentColor; }
  .plotbar { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; font: 600 0.82rem var(--body); color: var(--ink); font-variant-numeric: tabular-nums; }
  .plotbar button { border: 0; border-radius: 8px; padding: 6px 12px; font: 700 0.8rem var(--body); cursor: pointer; background: var(--accent); color: var(--accent-ink); }
  .plotbar #plot-remove { background: transparent; color: var(--muted); padding: 6px 8px; }
  .plotbar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (pointer: coarse) { .dock kbd { display: none; } }
  .pickup {
    display: inline-flex; align-items: center; gap: 8px; padding: 9px 16px;
    background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 999px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(20, 40, 20, 0.22); font: 700 0.9rem var(--body); cursor: pointer;
  }
  .pickup:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>

  <div>

  <div class="group">
    <span class="label" id="cam-label">Camera</span>
    <div class="seg" role="group" aria-labelledby="cam-label">
      <button id="cam-follow" data-cam="follow" aria-pressed="true">Follow hero</button>
      <button id="cam-free" data-cam="free" aria-pressed="false">Free</button>
    </div>
  </div>
  <div class="group">
    <span class="label" id="mount-label">Mounts</span>
    <div class="seg" role="group" aria-labelledby="mount-label">
      <button data-ride="horse" aria-pressed="false">Horse</button>
      <button data-ride="bird" aria-pressed="false">Thunder Runner</button>
      <button data-ride="serpent" aria-pressed="false">Lantern Serpent</button>

  <div class="group">
    <span class="label">Wood <output id="wood-out">0</output></span>

</section>
<div class="dock">
  <button class="pickup" id="pickup" hidden>Pick Up <kbd>E</kbd></button>

    <button id="plot-work">Work on plot</button>

    <button data-size="6" aria-pressed="true">6×6</button>
    <button data-size="8" aria-pressed="false">8×8</button>
  </div>
  <div class="seg toolbar" role="group" aria-label="What a click does">
    <button data-mode="walk" aria-pressed="true">Walk <kbd>1</kbd></button>
    <button data-mode="clear" aria-pressed="false">Clear <kbd>2</kbd></button>
    <button data-mode="plot" aria-pressed="false">Plot <kbd>3</kbd></button>
  </div>
</div>

{ "imports": {

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { Reflector } from "three/addons/objects/Reflector.js";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

const FIELD = 44;      // grass covers FIELD x FIELD metres (1 m = 1 server cell), centred on the origin
const coarse = matchMedia("(pointer: coarse)").matches;
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, coarse ? 1.5 : 1.75));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.1;
$("stage").appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 400);
camera.position.set(0, 15, 13);
camera.layers.enable(1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = 1.41;   // low enough to look along the ground at the sky
controls.minDistance = 3;
controls.maxDistance = 45;

// ---------- the dirt path the grass grows up to

const PATH = [[-30, -9], [-18, -5], [-9, -8], [0, -4], [8, 1], [16, -1], [30, 4]].map(([x, z]) => new THREE.Vector2(x, z));
function pathDistance(x, z) {
  let best = 1e9;
  const p = new THREE.Vector2(x, z), ab = new THREE.Vector2(), ap = new THREE.Vector2();
  for (let i = 0; i < PATH.length - 1; i++) {
    ab.subVectors(PATH[i + 1], PATH[i]);
    ap.subVectors(p, PATH[i]);
    const t = Math.max(0, Math.min(1, ap.dot(ab) / ab.lengthSq()));
    best = Math.min(best, ap.sub(ab.multiplyScalar(t)).length());
  }
  return best;
}
const PATH_HALF = 1.1;

// ---------- the lake: one shape shared with the shaders, so shore, depth and foam always line up

const LAKE = { x: 10, z: 12, r: 8 };
function lakeDistance(x, z) { // < 0 inside the lake, roughly metres to the shore
  const dx = x - LAKE.x, dz = (z - LAKE.z) / 0.8, a = Math.atan2(dz, dx);
  return Math.hypot(dx, dz) - LAKE.r - 1.1 * Math.sin(a * 3 + 0.7) - 0.6 * Math.sin(a * 5 + 2.1);
}
// A wide shallow shelf to wade on for the first 2.5 m, then the basin drops away to 2.6 m deep.
function groundHeight(x, z) {
  const s = -lakeDistance(x, z);
  return s <= 0 ? 0 : -(0.18 * Math.min(s, 2.5) + 2.15 * THREE.MathUtils.smoothstep(s, 2.5, 6.5));
}
const waterLevel = (t) => -0.03 + 0.02 * Math.sin(t * 0.8) + 0.008 * Math.sin(t * 2.1 + 1.0); // matches the lake shader
const WADE = -0.45; // deepest ground a walker will wade over (about waist deep)

// ---------- shared GLSL: noise, wind, clouds, fog

const COMMON = /* glsl */ `
  uniform float uTime, uWind, uStorm;
  uniform vec3 uLake; // centre x, centre z, radius
  float lakeDistance(vec2 p) {
    vec2 q = vec2(p.x - uLake.x, (p.y - uLake.y) / 0.8);
    float a = atan(q.y, q.x);
    return length(q) - uLake.z - 1.1 * sin(a * 3.0 + 0.7) - 0.6 * sin(a * 5.0 + 2.1);
  }
  float groundHeight(vec2 p) {
    float s = -lakeDistance(p);
    return s <= 0.0 ? 0.0 : -(0.18 * min(s, 2.5) + 2.15 * smoothstep(2.5, 6.5, s));
  }
  uniform vec2 uWindDir;
  float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
  float noise(vec2 p) {
    vec2 i = floor(p), f = fract(p), u = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), u.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), u.x), u.y);
  }
  float fbm(vec2 p) { float v = 0.0, a = 0.5; for (int k = 0; k < 4; k++) { v += a * noise(p); p *= 2.03; a *= 0.5; } return v; }
  // Gust strength at a ground point: a noise field blown along the wind, faster in a storm.
  float gust(vec2 xz) {
    vec2 q = xz * 0.09 - uWindDir * uTime * (0.35 + 1.4 * uWind);
    return smoothstep(0.32, 0.82, fbm(q));
  }
  float cloudShadow(vec2 xz) {
    float n = fbm(xz * 0.03 - uWindDir * uTime * (0.02 + 0.08 * uWind));
    return smoothstep(0.52 - 0.18 * uStorm, 0.64 - 0.14 * uStorm, n);
  }
`;
const WIND_VERTEX = /* glsl */ `
  // Trample map: rg = direction away from whoever walked here, b = how pressed down (fades back to 0).
  uniform sampler2D uTrample;
  uniform vec4 uTrampleRect; // min x, min z, size
  // Bends a point of a plant rooted at 'root' by height fraction t (0 root .. 1 tip) of a plant 'h' tall.
  vec3 bendPlant(vec3 root, vec3 local, float t, float h, float rnd, out float g, out float pressed) {
    g = gust(root.xz);
    vec4 tr = texture2D(uTrample, (root.xz - uTrampleRect.xy) / uTrampleRect.z);
    pressed = tr.b;
    vec2 away = (tr.rg * 2.0 - 1.0) * pressed;
    float sway = sin(uTime * (2.0 + 3.0 * uWind) + rnd * 6.283 + root.x * 0.4) * (0.05 + 0.12 * uWind);
    float push = ((0.08 + 0.9 * g) * (0.15 + 1.25 * uWind) + sway) * (1.0 - 0.6 * pressed);
    vec2 lean = vec2(cos(rnd * 6.283), sin(rnd * 6.283)) * 0.22;
    vec2 d = uWindDir * push + lean + away * 1.7;
    float k = t * t;
    vec3 p = root + local;
    p.xz += d * k * h;
    p.y -= dot(d, d) * k * h * 0.3;
    p.y = max(p.y, root.y + 0.03 * t);
    return p;
  }
`;
const SHADE = /* glsl */ `
  uniform vec3 uSky, uSunCol, uAmbient, uShadowTint;
  uniform float uSun, uFogNear, uFogFar;
  uniform vec4 uWalkers[9]; // xy = shadow centre, z = radius (0 = unused)
  float blobShadow(vec2 xz) {
    float s = 1.0;
    for (int i = 0; i < 9; i++) {
      if (uWalkers[i].z <= 0.0) continue;
      float d = length(xz - uWalkers[i].xy) / uWalkers[i].z;
      s *= mix(0.4, 1.0, smoothstep(0.3, 1.0, d));
    }
    return s;
  }
  uniform vec4 uTrees[32]; // xy = shadow centre on the ground, z = radius (0 = unused)
  float treeShadow(vec2 xz) {
    float s = 1.0;
    for (int i = 0; i < 32; i++) {
      if (uTrees[i].z <= 0.0) continue;
      float d = length(xz - uTrees[i].xy) / uTrees[i].z;
      if (d >= 1.2) continue;
      // Leafy holes let sun through near the edge, which gives the dappled look.
      float holes = smoothstep(0.45, 0.75, noise(xz * 2.3 + uTime * 0.15 * uWind));
      s *= mix(mix(0.35, 0.8, holes * smoothstep(0.4, 1.0, d)), 1.0, smoothstep(0.85, 1.15, d));
    }
    return s;
  }
  // receive = 1 for things on the ground (they catch tree and walker shadows), 0 for tree canopies.
  vec3 light(vec3 albedo, vec2 xz, float facing, float viewDepth, float receive) {
    float cs = cloudShadow(xz), bs = mix(1.0, blobShadow(xz) * treeShadow(xz), receive);
    vec3 sunLight = uSunCol * uSun * mix(1.0, 0.0, cs) * facing * bs;
    vec3 c = albedo * (uAmbient * mix(vec3(1.0), uShadowTint, cs * 0.6) * mix(0.7, 1.0, bs) + sunLight);
    return mix(c, uSky, smoothstep(uFogNear, uFogFar, viewDepth));
  }
`;

const colors = {
  root: new THREE.Color("#2f6a2e"), mid: new THREE.Color("#5fae3e"), tip: new THREE.Color("#b9e676"),
  cool: new THREE.Color("#cfe9df"), warm: new THREE.Color("#fff3c4"),
  dirt: new THREE.Color("#a9774c"), dirtDark: new THREE.Color("#8a5d3a"),
};
const uniforms = {
  uTime: { value: 0 }, uWind: { value: 0.35 }, uStorm: { value: 0 },
  uWindDir: { value: new THREE.Vector2(0.86, -0.5).normalize() },
  uSky: { value: new THREE.Color("#b9d8ee") }, uSunCol: { value: new THREE.Color("#fff1d6") },
  uAmbient: { value: new THREE.Color("#9fb7c9") }, uShadowTint: { value: new THREE.Color("#7f9bc0") },
  uSun: { value: 1.25 }, uFogNear: { value: 75 }, uFogFar: { value: 170 },
  uRoot: { value: colors.root }, uMid: { value: colors.mid }, uTip: { value: colors.tip },
  uCool: { value: colors.cool }, uWarm: { value: colors.warm },
  uDirt: { value: colors.dirt }, uDirtDark: { value: colors.dirtDark },
};
uniforms.uLake = { value: new THREE.Vector3(LAKE.x, LAKE.z, LAKE.r) };
// Rings spreading from footsteps in the water: xy = where, z = start time, w = strength.
const RIPPLES = 48;
uniforms.uRipples = { value: Array.from({ length: RIPPLES }, () => new THREE.Vector4(0, 0, -100, 0)) };
uniforms.uFeet = { value: Array.from({ length: 9 }, () => new THREE.Vector4()) }; // x, z, 1 when standing in water, foam ring radius
let rippleNext = 0;
function addRipple(x, z, strength) {
  uniforms.uRipples.value[rippleNext].set(x, z, uniforms.uTime.value, strength);
  rippleNext = (rippleNext + 1) % RIPPLES;
}
Object.assign(uniforms, {
  uSand: { value: new THREE.Color("#e6cf9c") }, uSandWet: { value: new THREE.Color("#bf9a68") }, uBed: { value: new THREE.Color("#9c845d") },
  uSoil: { value: new THREE.Color("#9a6f48") }, uSoilWet: { value: new THREE.Color("#5b3a24") }, uSoilPacked: { value: new THREE.Color("#c9a77c") },
  uShallow: { value: new THREE.Color("#18c6b3") }, uMidWater: { value: new THREE.Color("#068dbd") }, uDeepWater: { value: new THREE.Color("#113d8a") },
});

// Trample map over the field, written on the CPU each frame and fading back over ~2 s.
const TR = { n: 256, min: -24, size: 48 };
const trData = new Uint8Array(TR.n * TR.n * 4);
for (let i = 0; i < trData.length; i += 4) { trData[i] = 128; trData[i + 1] = 128; }
const trTex = new THREE.DataTexture(trData, TR.n, TR.n, THREE.RGBAFormat);
trTex.magFilter = trTex.minFilter = THREE.LinearFilter;
trTex.needsUpdate = true;
uniforms.uTrample = { value: trTex };
uniforms.uTrampleRect = { value: new THREE.Vector4(TR.min, TR.min, TR.size, 0) };
uniforms.uWalkers = { value: Array.from({ length: 9 }, () => new THREE.Vector4()) };
uniforms.uTrees = { value: Array.from({ length: 32 }, () => new THREE.Vector4()) };

function fadeTrample(dt) {
  const f = Math.exp(-dt / 1.8);
  for (let i = 2; i < trData.length; i += 4) if (trData[i]) trData[i] = (trData[i] * f) | 0;
}
function stampTrample(x, z, radius) {
  const texel = TR.size / TR.n, cx = (x - TR.min) / texel, cz = (z - TR.min) / texel, r = radius / texel;
  for (let iz = Math.max(0, Math.floor(cz - r)); iz <= Math.min(TR.n - 1, Math.ceil(cz + r)); iz++) {
    for (let ix = Math.max(0, Math.floor(cx - r)); ix <= Math.min(TR.n - 1, Math.ceil(cx + r)); ix++) {
      const dx = ix + 0.5 - cx, dz = iz + 0.5 - cz, len = Math.hypot(dx, dz), d = len / r;
      if (d >= 1) continue;
      const strength = (Math.pow(1 - d, 0.6) * 255) | 0, k = (iz * TR.n + ix) * 4;
      if (strength <= trData[k + 2]) continue;
      const inv = 1 / (len || 1);
      trData[k] = (128 + dx * inv * 127) | 0;
      trData[k + 1] = (128 + dz * inv * 127) | 0;
      trData[k + 2] = strength;
    }
  }
}

// ---------- the land map: how much grass grows on each patch of ground, so cleared ground stays bare and grass creeps
// back in from the edges. It covers the same square as the trample map: r = grass growth (0 bare, 1 full), g = levelled
// for building (grass never comes back), b = soil wetness (freshly dug earth is dark, then dries). The data lives in
// the typed arrays below and goes to the GPU at most four times a second.
// regrowDelay: seconds before cut grass starts sprouting; regrowTime: seconds for a patch beside full grass to fill
// in; base: the share of that rate a patch with no grass near it still gets; blur: texels round a patch that count
// as "near"; dryTime: seconds for dug soil to dry.
const LAND = { n: 256, min: -24, size: 48, regrowDelay: 30, regrowTime: 90, base: 0.04, blur: 4, dryTime: 40 };
const LN = LAND.n, landTexel = LAND.size / LN;
const land = {
  grow: new Float32Array(LN * LN).fill(1), level: new Float32Array(LN * LN), wet: new Float32Array(LN * LN),
  rest: new Float32Array(LN * LN), fertile: new Float32Array(LN * LN), near: new Float32Array(LN * LN), tmp: new Float32Array(LN * LN),

// A trunk's outline as a factor on its radius: `n` ridges that swell into buttress roots near the ground, plus fine
// flutes. o: { n, buttress (extra at the ground), rise (m it fades over), ridge (all the way up), flutes, flute }.
function trunkLobes(o, phase) {
  return (phi, y) => {
    const ridge = Math.pow(0.5 + 0.5 * Math.cos(o.n * phi + phase), 3);   // narrow ridges between rounder hollows
    return 1 + (o.buttress * Math.exp(-Math.max(0, y) / o.rise) + o.ridge) * (ridge - 0.2) + o.flute * Math.cos(o.flutes * phi + phase * 2.3);
  };
}
// A limb along a smooth curve through `points`, tapering from r0 to r1, open at both ends (they hide in the trunk or
// a leaf clump). o.radius(d, len) replaces the straight taper (d = metres along); o.collar swells the base where it
// grows out of its parent; o.lobe(phi, y) shapes a trunk's outline, with o.y0 added to y. A trunk's bark is laid by
// compass angle and height, as the stump's is, so the two line up at the cut. o.capEnd closes the far end (a trunk
// that splits into limbs there).
function limbGeometry(points, r0, r1, radial = 8, o = {}) {
  const curve = new THREE.CatmullRomCurve3(points), len = curve.getLength();
  const segs = Math.max(2, Math.ceil(len / (o.lobe ? 0.12 : 0.25))), frames = curve.computeFrenetFrames(segs, false);
  const rings = [], vs = [], us = [];
  for (let i = 0; i <= segs; i++) {
    const t = i / segs, d = t * len, p = curve.getPointAt(t), N = frames.normals[i], B = frames.binormals[i];
    us.push(o.lobe ? -Math.atan2(N.z, N.x) / (Math.PI * 2) : 0);
    let r = o.radius ? o.radius(d, len) : r0 + (r1 - r0) * t;
    if (o.collar) r *= 1 + o.collar * Math.exp(-d / (2.5 * r0));
    const ring = [];
    for (let j = 0; j <= radial; j++) {
      const a = ((j % radial) / radial) * Math.PI * 2, ca = Math.cos(a), sa = Math.sin(a);
      const dir = V3(ca * N.x + sa * B.x, ca * N.y + sa * B.y, ca * N.z + sa * B.z);
      ring.push(p.clone().addScaledVector(dir, r * (o.lobe ? o.lobe(Math.atan2(dir.z, dir.x), p.y + (o.y0 || 0)) : 1)));
    }
    rings.push(ring);
    vs.push(d + (o.y0 || 0));
  }
  const g = ringGeometry(rings, vs, us);
  return o.capEnd ? mergeGeometries([g, capGeometry(rings[rings.length - 1], true)]) : g;
}
// The stump: from just under the ground up to the cut at `h`, flaring toward the ground (`flare` × the radius there)
// with the trunk's outline (`lobe`), capped with end grain. Group 0 is bark, group 1 the cut. `turn` is the trunk's
// turn about the vertical, so the bark lines up with the trunk's.
function stumpGeometry(R, h, flare, lobe, radial, turn) {
  const rings = [], vs = [], us = [];
  for (let k = 0; k <= 10; k++) {
    const y = -0.1 + (h + 0.1) * Math.pow(k / 10, 1.5), spread = 1 + (flare - 1) * Math.pow(1 - Math.max(0, y) / h, 2);
    rings.push(flatRing(y, radial, (phi) => R * spread * lobe(phi, y)));
    vs.push(y);
    us.push(-turn / (Math.PI * 2));
  }
  return mergeGeometries([ringGeometry(rings, vs, us), capGeometry(rings[10], true)], true);
}
// Stretches the v of a cylinder's side (its first vertices; the caps come after) from 0..1 to its length in metres,
// to match limbGeometry.
function metresUV(g, len) {
  const uv = g.getAttribute("uv"), side = (g.parameters.radialSegments + 1) * (g.parameters.heightSegments + 1);
  for (let i = 0; i < side; i++) uv.setY(i, uv.getY(i) * len);
  return g;
}

// The trees outside the choppable ones: bushes, two pines, and a ring of forest beyond the meadow. All their leaves
// are one mesh and their bark one mesh per material.
function growFoliage() {
  const rand = mulberry32(42), cards = newCards(), shadows = [], barkParts = new Map();
  const pick = (weights) => { let r = rand() * weights.reduce((a, [, w]) => a + w, 0); for (const [k, w] of weights) if ((r -= w) <= 0) return k; return weights[0][0]; };
  const bark = (mat, geo) => { if (!barkParts.has(mat)) barkParts.set(mat, []); barkParts.get(mat).push(geo); };
  const clump = (cx, cy, cz, r, size, pal, kind, stiff, squash = 1) =>
    addClump(cards, rand, cx, cy, cz, r, squash, { pal: PALETTES[pal], kind, size, density: 130, stiff });

  // Broadleaf: a tall trunk forking into branches, each ending in a leaf clump, plus a crown clump.
  function broadleaf(x, z, s, pal, kind) {
    const H = (2.7 + rand() * 0.7) * s, crown = H + 1.5 * s, at = (px, py, pz) => V3(x + px, py, z + pz);
    bark(BARK.pine, limbGeometry([at(0, -0.1, 0), at(0, H * 0.5, 0), at(0, crown - 0.3 * s, 0)], 0.3 * s, 0.07 * s));
    bark(BARK.dark, new THREE.ConeGeometry(0.48 * s, 0.55 * s, 8).translate(x, 0.22 * s, z));
    clump(x, crown, z, 1.45 * s, (kind === LEAF.oak ? 0.75 : 0.62) * s, pal, kind, 0);
    const n = 4 + Math.floor(rand() * 3);
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rand() * 0.7, d = (1.2 + rand() * 0.6) * s, y = H + (0.1 + rand() * 1.1) * s;
      const fy = H * (0.6 + rand() * 0.25), end = at(Math.cos(a) * d, y, Math.sin(a) * d);
      bark(BARK.pine, limbGeometry([at(0, fy, 0), at(Math.cos(a) * d * 0.5, (fy + y) / 2 + 0.2 * s, Math.sin(a) * d * 0.5), end], 0.11 * s, 0.04 * s, 6));
      clump(end.x, y + 0.25 * s, end.z, (0.85 + rand() * 0.35) * s, (kind === LEAF.oak ? 0.7 : 0.58) * s, pal, kind, 0);
    }
  }
  // Birch: a slim white trunk with small clumps stacked up its top half.
  function birch(x, z, s, pal) {
    const H = (5.6 + rand() * 1.2) * s, lean = (rand() - 0.5) * 0.5;
    bark(BARK.birch, limbGeometry([V3(x, -0.1, z), V3(x + lean * 0.5, H * 0.5, z), V3(x + lean * 0.2, H, z + lean * 0.3)], 0.16 * s, 0.04 * s, 7));
    for (let i = 0; i < 5; i++) {
      const f = 0.45 + 0.13 * i, a = i * 2.4 + rand(), d = (1.1 - 0.6 * f) * s;
      clump(x + Math.cos(a) * d, H * f + 0.5 * s, z + Math.sin(a) * d, (1.05 - 0.4 * f) * s, 0.42 * s, pal, LEAF.birch, 0.2, 0.65);
    }
  }
  // Pine: a straight trunk with tiers of flattened clumps getting smaller toward the tip.
  // Pine (a fir): a cone of drooping tiers of needles, widest at the bottom, closing to a pointed tip; only the foot of
  // the trunk shows, and it ends inside the top tiers.
  function pine(x, z, s) {
    const H = (6.4 + rand() * 1.2) * s, base = 0.95 * s, tiers = 7 + ((rand() * 2) | 0), lean = (rand() - 0.5) * 0.12;
    bark(BARK.pine, limbGeometry([V3(x, -0.1, z), V3(x, H * 0.4, z), V3(x + lean * 0.7, H * 0.7, z)], 0.21 * s, 0.05 * s, 8));
    const skirt = (y, R, h, size) => addSkirt(cards, rand, x + lean * y / H, y, z, R, h,
      { pal: PALETTES.pine, kind: LEAF.needles, size, density: 80, stiff: 0.6 });
    for (let k = 0; k < tiers; k++) {
      const f = k / tiers, y = base + (H - base) * f + 0.5 * s, step = (H - base) / tiers;
      skirt(y, (2.0 * Math.pow(1 - f, 0.95) + 0.3) * s * (0.92 + rand() * 0.16), step * 0.75, (0.45 + 0.2 * (1 - f)) * s);
    }
    skirt(H + 0.2 * s, 0.38 * s, 0.75 * s, 0.38 * s);   // the tip, a narrow spire on the last tier
  }

  const lift = 0.85 / sunDir.y;
  const shade = (x, z, h, r) => shadows.push([x - sunDir.x * h * lift, z - sunDir.z * h * lift, r]);
  // (The trees inside the meadow are the choppable ones, planted later.)
  for (const [x, z, s] of [[18, 4, 0.8], [-12, -11, 0.75]]) {
    if (pathDistance(x, z) < PATH_HALF + 2 || lakeDistance(x, z) < 3) continue;
    pine(x, z, s);
    OBSTACLES.push({ x, z, r: 0.45 * s });
    FIXED.push({ x, z, r: 0.45 * s });
    shade(x, z, 3.2 * s, 1.6 * s);
  }
  // Bushes in each grove's colours: maroon oak-leaf bushes, green birch-leaf bushes, pink and red by the lake.
  const BUSHES = { autumn: [["maroon", LEAF.oak], ["ember", LEAF.oak]], birch: [["green", LEAF.birch], ["teal", LEAF.birch]],
    silk: [["blossom", LEAF.pointed], ["maroon", LEAF.pointed]] };
  for (const [x, z] of [[-12, -1], [5, -11], [-15, 10], [13, -5], [-1, 13], [17, 8], [-21, -6], [-8, 9], [10, -17]]) {
    if (pathDistance(x, z) < PATH_HALF + 1.8 || lakeDistance(x, z) < 2.4) continue;
    const [pal, kind] = BUSHES[zoneAt(x, z)][rand() < 0.5 ? 0 : 1], bc = newCards();
    for (let i = 0, n = 3 + Math.floor(rand() * 2); i < n; i++) {
      const a = rand() * Math.PI * 2, d = rand() * 0.8;
      addClump(bc, rand, x + Math.cos(a) * d, 0.55 + rand() * 0.25, z + Math.sin(a) * d, 0.75 + rand() * 0.3, 1,
        { pal: PALETTES[pal], kind, size: kind === LEAF.oak ? 0.55 : 0.45, density: 130, stiff: 0.3 });
    }
    const mesh = cardMesh(bc, foliageMat), obstacle = { x, z, r: 1.15 };
    scene.add(mesh);
    OBSTACLES.push(obstacle);
    bushes.push({ x, z, r: 1.15, mesh, obstacle, hp: 2, wob: 0, gone: false, fx: PALETTES[pal].slice(1), slot: shadows.length < 16 ? shadows.length : -1 });
    shade(x, z, 0.7, 1.4);
  }
  // A ring of forest beyond the meadow for depth, in the colours of the grove it backs: no gameplay role.
  const RING = { autumn: [["ember", 3], ["amber", 2], ["maroon", 1.5]], silk: [["green", 4], ["gold", 1.5], ["silk", 2]] };
  for (let i = 0; i < 34; i++) {
    const a = (i / 34) * Math.PI * 2 + rand() * 0.15, r = 27 + rand() * 9, x = Math.cos(a) * r, z = Math.sin(a) * r;
    if (pathDistance(x, z) < PATH_HALF + 3) continue;
    const zone = zoneAt(x, z), roll = rand();
    if (zone === "birch") roll < 0.2 ? pine(x, z, 0.9 + rand() * 0.5) : birch(x, z, 1 + rand() * 0.3, roll < 0.45 ? "gold" : "teal");
    else if (zone === "silk" && roll < 0.35) pine(x, z, 0.9 + rand() * 0.5);
    else broadleaf(x, z, 1.1 + rand() * 0.4, pick(RING[zone]), zone === "autumn" ? LEAF.oak : LEAF.pointed);
  }
  shadows.slice(0, 16).forEach(([sx, sz, r], i) => uniforms.uTrees.value[i].set(sx, sz, r, 0));
  treeShadowsUsed = Math.min(16, shadows.length);

  for (const [mat, parts] of barkParts) scene.add(new THREE.Mesh(mergeGeometries(parts), mat));
  scene.add(cardMesh(cards, foliageMat));
  return cards.radii.length;
}

// ---------- lake water: clear turquoise shallows, deep blue middle, foam that washes the shore, real reflections

const lake = new Reflector(new THREE.PlaneGeometry(30, 26), { textureWidth: 512, textureHeight: 512, clipBias: 0.01 });
lake.rotation.x = -Math.PI / 2;
lake.position.set(LAKE.x, -0.01, LAKE.z);
uniforms.tReflect = { value: lake.getRenderTarget().texture };
uniforms.uReflectMatrix = { value: lake.material.uniforms.textureMatrix.value };
lake.material = new THREE.ShaderMaterial({
  uniforms,
  transparent: true,
  depthWrite: false,
  vertexShader: /* glsl */ `
    uniform mat4 uReflectMatrix;
    varying vec4 vRefl; varying vec3 vWorld; varying float vDepth;
    void main() {
      vRefl = uReflectMatrix * vec4(position, 1.0);
      vec4 w = modelMatrix * vec4(position, 1.0);
      vWorld = w.xyz;
      vec4 mv = viewMatrix * w;
      vDepth = -mv.z;
      gl_Position = projectionMatrix * mv;
    }`,
  fragmentShader: /* glsl */ `
    ${COMMON} ${SHADE}
    uniform sampler2D tReflect, uTrample;
    uniform vec4 uTrampleRect;
    uniform vec4 uRipples[${RIPPLES}];
    uniform vec4 uFeet[9];
    uniform vec3 uShallow, uMidWater, uDeepWater;
    varying vec4 vRefl; varying vec3 vWorld; varying float vDepth;
    void main() {
      vec2 xz = vWorld.xz;
      float level = -0.03 + 0.02 * sin(uTime * 0.8) + 0.008 * sin(uTime * 2.1 + 1.0);
      float d = level - groundHeight(xz);                    // depth here, right now
      if (d < 0.0) discard;
      float rough = 0.6 + 1.6 * uWind;
      vec2 ripple = (vec2(noise(xz * 1.4 + uWindDir * uTime * (0.4 + 1.2 * uWind)), noise(xz * 1.4 - uTime * 0.3 + 7.0)) - 0.5) * rough;
      // Rings spreading out from each step taken in the water.
      float rings = 0.0;
      vec2 push = vec2(0.0);
      for (int i = 0; i < ${RIPPLES}; i++) {
        vec4 rp = uRipples[i];
        float age = uTime - rp.z;
        if (age < 0.0 || age > 2.2) continue;
        vec2 dv = xz - rp.xy;
        float dist = length(dv), radius = 0.15 + age * 0.85;
        float band = exp(-pow((dist - radius) / (0.05 + age * 0.035), 2.0)) * (1.0 - age / 2.2) * rp.w;
        rings += band;
        push += dv / max(dist, 1e-3) * band;
      }
      vec4 r = vRefl;
      r.xy += (ripple * 0.05 + push * 0.06) * r.w;
      vec3 refl = texture2DProj(tReflect, r).rgb;
      vec3 col = mix(uShallow, uMidWater, smoothstep(0.0, 0.8, d));
      col = mix(col, uDeepWater, smoothstep(0.6, 2.4, d));
      float cs = cloudShadow(xz);
      vec3 sunLit = uSunCol * uSun * (1.0 - cs);
      vec3 lit = col * (uAmbient * mix(vec3(1.0), uShadowTint, cs * 0.6) + sunLit * 0.75);
      lit = mix(lit, refl, 0.16 + 0.16 * uStorm);
      lit = max(mix(vec3(dot(lit, vec3(0.299, 0.587, 0.114))), lit, 1.35), 0.0);   // AgX mutes the turquoise; push it back
      // Foam: a ragged line where the wash meets the sand, bands rolling in, whitecaps in a storm.
      float edge = 1.0 - smoothstep(0.0, 0.035 + 0.04 * noise(xz * 3.0 + uTime), d);
      float rolling = smoothstep(0.9, 0.96, fract(d * 2.2 - uTime * (0.25 + 0.4 * uWind) + noise(xz * 0.8) * 0.7));
      rolling *= (1.0 - smoothstep(0.15, 0.9, d)) * step(0.5, noise(xz * 2.4 + uTime * 0.3));
      float caps = step(0.9 - 0.12 * uStorm, noise(xz * 1.8 + uWindDir * uTime * 1.5)) * uStorm * smoothstep(0.8, 2.0, d);
      // Churned water left behind by anyone who waded through (the same trample map the grass uses).
      float churn = texture2D(uTrample, (xz - uTrampleRect.xy) / uTrampleRect.z).b;
      float trail = churn * smoothstep(0.4, 0.7, noise(xz * 7.0 + uTime * 2.0)) * 0.9;
      // A ring of foam hugging the legs of whoever is standing in the water.
      float legs = 0.0;
      for (int i = 0; i < 9; i++) {
        if (uFeet[i].z < 0.5) continue;
        float fd = length(xz - uFeet[i].xy);
        legs = max(legs, exp(-pow((fd - uFeet[i].w) / 0.06, 2.0)) * (0.65 + 0.35 * noise(xz * 9.0 + uTime * 3.0)));
      }
      float foam = max(max(max(edge, rolling), caps), max(max(trail, legs), min(rings, 1.0) * 0.5));
      lit = mix(lit, vec3(0.95) * (uAmbient + sunLit * 0.6), foam * 0.85);
      lit += min(rings, 1.0) * 0.4 * (uAmbient + sunLit * 0.5);   // bright crests of the step rings
      // Sun glints on open water, gone under clouds and in a storm.
      lit += step(0.94, noise(xz * 5.0 + uTime * 0.6)) * step(0.3, d) * 0.5 * uSun * (1.0 - cs) * (1.0 - uStorm);
      lit = mix(lit, uSky, smoothstep(uFogNear, uFogFar, vDepth));
      gl_FragColor = vec4(lit, max(mix(0.62, 0.95, smoothstep(0.0, 0.7, d)), foam));
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
});
scene.add(lake);

// ---------- light: two looks for the whole scene. Golden hour follows the Tree Damage reel: a violet sky fading to
// pink at the horizon, warm low sun, lavender shade, golden grass and white-pink clouds. Day is the clear midday look.
// sky: zenith, mid sky, horizon (also the haze far things fade into); cloud: lit and shaded side, how much sky they
// cover; sun: colour and strength; ambient and shadowTint: shade and cloud-shadow colour; hemi: sky and ground light
// on the models; grass: blade colour root → mid → tip, and the cool/warm patch tints.
const LOOKS = {
  golden: { sky: ["#3f56c8", "#9a6ad6", "#f6d4dc"], cloud: ["#fff8f2", "#e2bcda", 0.42], sun: ["#ffd49a", 1.45],
    ambient: "#b9b0c2", shadowTint: "#8f7cc0", hemi: ["#ead6ff", "#8a7a22"], exposure: 1.12, fog: [70, 170],
    grass: { root: "#3c5208", mid: "#9fae1c", tip: "#f2e23a", cool: "#dcf59a", warm: "#ffd24a" } },
  day: { sky: ["#86b9e6", "#a8cdec", "#b9d8ee"], cloud: ["#ffffff", "#c6d4e4", 0.3], sun: ["#fff1d6", 1.25],
    ambient: "#9fb7c9", shadowTint: "#7f9bc0", hemi: ["#e3f1ff", "#6c9a48"], exposure: 1.1, fog: [75, 170],
    grass: { root: "#2f6a2e", mid: "#5fae3e", tip: "#b9e676", cool: "#cfe9df", warm: "#fff3c4" } },
};
let look = LOOKS.golden;

// ---------- weather: the wind slider also brings in the storm

const calmSky = new THREE.Color("#b9d8ee"), stormSky = new THREE.Color("#5d6f7f");
const calmAmb = new THREE.Color("#9fb7c9"), stormAmb = new THREE.Color("#6f8291");
function setWind(v) {
  uniforms.uWind.value = v;
  const storm = THREE.MathUtils.smoothstep(v, 0.6, 1.0);
  uniforms.uStorm.value = storm;
  uniforms.uSun.value = THREE.MathUtils.lerp(look.sun[1], 0.35, storm);
  uniforms.uSky.value.lerpColors(calmSky, stormSky, storm);
  uniforms.uAmbient.value.lerpColors(calmAmb, stormAmb, storm);
  scene.background = uniforms.uSky.value;
  document.body.style.setProperty("--sky", "#" + uniforms.uSky.value.getHexString());
  $("wind-out").textContent = v < 0.2 ? "Calm" : v < 0.6 ? "Breeze" : v < 0.85 ? "Strong wind" : "Storm";
}
$("wind").addEventListener("input", (e) => setWind(Number(e.target.value)));
setWind(0.35);

// ---------- sky: a dome round the camera with the look's colours, the sun's glow, and painterly clouds drifting
// on the wind (more of them, and greyer, in a storm)
Object.assign(uniforms, { uSkyTop: { value: new THREE.Color() }, uSkyMid: { value: new THREE.Color() },
  uCloudLit: { value: new THREE.Color() }, uCloudShade: { value: new THREE.Color() }, uCloudCover: { value: 0.4 } });
const skyDome = new THREE.Mesh(new THREE.SphereGeometry(330, 48, 24), new THREE.ShaderMaterial({
  uniforms, side: THREE.BackSide, depthWrite: false,
  vertexShader: /* glsl */ `
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }`,
  fragmentShader: /* glsl */ `
    ${COMMON}
    uniform vec3 uSky, uSkyTop, uSkyMid, uCloudLit, uCloudShade, uSunDir, uSunCol;
    uniform float uCloudCover;
    varying vec3 vDir;
    float clouds(vec2 q) { return fbm(q * 0.9) * 0.65 + fbm(q * 2.3 + 7.0) * 0.35; }
    void main() {
      vec3 d = normalize(vDir);
      float h = max(d.y, 0.0), sunAmt = max(dot(d, uSunDir), 0.0), calm = 1.0 - uStorm;
      vec3 col = mix(uSky, uSkyMid, smoothstep(0.0, 0.14, h));
      col = mix(col, uSkyTop, smoothstep(0.12, 0.6, h));
      col += uSunCol * (pow(sunAmt, 6.0) * 0.22 + pow(sunAmt, 300.0) * 1.2) * calm;
      // Cumulus on a plane overhead: lit on the side facing the sun (thinner a step sunward), shaded underneath.
      vec2 q = d.xz / (d.y + 0.12) * 1.3 + uWindDir * uTime * (0.01 + 0.03 * uWind);
      float n = clouds(q), cover = uCloudCover + 0.35 * uStorm;
      float a = smoothstep(1.0 - cover, 1.0 - cover + 0.1, n) * smoothstep(0.0, 0.07, d.y);   // thinning into the haze
      float lit = clamp(0.55 + (n - clouds(q + uSunDir.xz * 0.3)) * 4.0 + 0.25 * sunAmt, 0.0, 1.0);
      vec3 cloud = mix(uCloudShade, uCloudLit, lit);
      cloud = mix(cloud, vec3(dot(cloud, vec3(0.3, 0.5, 0.2))) * 0.62, uStorm);
      col = mix(col, cloud, a * 0.96);
      col = max(mix(vec3(dot(col, vec3(0.299, 0.587, 0.114))), col, 1.25), 0.0);   // AgX mutes the sky too; push it back
      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
skyDome.renderOrder = -1;
skyDome.frustumCulled = false;
scene.add(skyDome);

// Applies a look (LOOKS) to the sky, light, shade and grass; the storm then blends from it.
function setLook(key) {
  look = LOOKS[key];
  uniforms.uSkyTop.value.set(look.sky[0]);
  uniforms.uSkyMid.value.set(look.sky[1]);
  calmSky.set(look.sky[2]);
  uniforms.uCloudLit.value.set(look.cloud[0]);
  uniforms.uCloudShade.value.set(look.cloud[1]);
  uniforms.uCloudCover.value = look.cloud[2];
  uniforms.uSunCol.value.set(look.sun[0]);
  calmAmb.set(look.ambient);
  uniforms.uShadowTint.value.set(look.shadowTint);
  [uniforms.uFogNear.value, uniforms.uFogFar.value] = look.fog;
  for (const k of ["root", "mid", "tip", "cool", "warm"]) colors[k].set(look.grass[k]);
  renderer.toneMappingExposure = look.exposure;
  setWind(uniforms.uWind.value);
  document.querySelectorAll("[data-look]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.look === key)));
}

const HALF = FIELD / 2 - 1.5;
const clampField = (v) => Math.max(-HALF, Math.min(HALF, v));
const blocked = (x, z, pad = 0.4) => OBSTACLES.some((o) => Math.hypot(x - o.x, z - o.z) < o.r + pad);
const dropObstacle = (o) => { const k = OBSTACLES.indexOf(o); if (k >= 0) OBSTACLES.splice(k, 1); };
function pickWanderTarget(w) {
  for (let tries = 0; tries < 20; tries++) {
    const a = Math.random() * Math.PI * 2, r = 5 + Math.random() * 9;
    const x = clampField(w.pos.x + Math.cos(a) * r), z = clampField(w.pos.z + Math.sin(a) * r);
    if (!blocked(x, z) && groundHeight(x, z) > -0.3) return new THREE.Vector3(x, 0, z);
  }
  return null;
}
const angleTo = (a, b) => Math.atan2(Math.sin(a - b), Math.cos(a - b));
const shadowOffset = new THREE.Vector2(-sunDir.x, -sunDir.z).multiplyScalar(0.28);

// Moves w toward w.target, steering around trees and bushes and stopping at water deeper than `wade`.
// Water slows it down unless it `swims`. Returns true while it is moving.
function travel(w, dt, maxSpeed, wade, swims = false) {
  const dx = w.target.x - w.pos.x, dz = w.target.z - w.pos.z, d = Math.hypot(dx, dz);
  if (d < 0.06) { w.target = null; w.idle = 0; return false; }
  let vx = dx / d, vz = dz / d;
  for (const o of OBSTACLES) {
    const ox = w.pos.x - o.x, oz = w.pos.z - o.z, od = Math.hypot(ox, oz), reach = o.r + 1.0;
    if (od < reach && od > 1e-4) { const k = (1 - od / reach) * 2.4; vx += (ox / od) * k; vz += (oz / od) * k; }
  }
  const wading = waterLevel(uniforms.uTime.value) - groundHeight(w.pos.x, w.pos.z) > 0.01;
  const vl = Math.hypot(vx, vz) || 1, step = Math.min(d, maxSpeed * (wading && !swims ? 0.6 : 1) * dt);
  const fromX = w.pos.x, fromZ = w.pos.z;
  w.pos.x += (vx / vl) * step;
  w.pos.z += (vz / vl) * step;
  for (const o of OBSTACLES) {
    const ox = w.pos.x - o.x, oz = w.pos.z - o.z, od = Math.hypot(ox, oz);
    if (od < o.r && od > 1e-4) { w.pos.x = o.x + (ox / od) * o.r; w.pos.z = o.z + (oz / od) * o.r; }
  }
  if (groundHeight(w.pos.x, w.pos.z) < wade) { w.pos.x = fromX; w.pos.z = fromZ; w.target = null; w.idle = 0; }
  // Give up on a target that cannot be reached (inside a bush, say).
  if (w.target) {
    const left = Math.hypot(w.target.x - w.pos.x, w.target.z - w.pos.z);
    w.stuck = left > d - step * 0.3 ? (w.stuck || 0) + dt : 0;
    if (w.stuck > 0.8) { w.target = null; w.idle = 0; w.stuck = 0; }
  }
  w.heading += angleTo(Math.atan2(vx, vz), w.heading) * Math.min(1, dt * 10);
  return true;
}

function stepWalker(w, i, dt, now) {
  if (w === hero && (hero.riding || hero.mounting !== null)) { poseRider(i, now); return; }
  if (w === hero && hero.task && stepJob(i, dt)) return;
  if (w === hero && hero.wantsMount) {
    // Walk round to the mount's left side, then climb on.
    const side = mountSide(hero.mount);
    hero.target = side;
    if (Math.hypot(hero.pos.x - side.x, hero.pos.z - side.z) < 0.35) { hero.wantsMount = false; hero.target = null; hero.mounting = now; hero.mountFrom = hero.root.position.clone(); }
  }
  let moving = false;
  if (!w.target) {
    w.idle += dt;
    // The hero wanders too once you leave it alone for a while, so the meadow is never still.
    if ((w.wander && w.idle > w.wait) || (!w.wander && w.idle > 8)) { w.target = pickWanderTarget(w); w.wait = 0.5 + Math.random() * 2.5; }
  }
  if (w.target) moving = travel(w, dt, w.maxSpeed, WADE);
  w.speed += ((moving ? 1 : 0) - w.speed) * Math.min(1, dt * 8);
  w.phase += dt * (6 + 3.5 * w.maxSpeed) * w.speed;
  const s = Math.sin(w.phase), sp = w.speed;
  w.legL.rotation.z = w.legR.rotation.z = w.armL.rotation.z = w.armR.rotation.z = 0;
  w.legL.rotation.x = s * 0.8 * sp;
  w.legR.rotation.x = -s * 0.8 * sp;
  w.armL.rotation.x = -s * 0.7 * sp;
  w.armR.rotation.x = s * 0.7 * sp;
  if (w === hero && hero.lift > 0) w.armL.rotation.x = w.armR.rotation.x = -2.9 * smooth01((0.85 - hero.lift) / 0.15) * smooth01(hero.lift / 0.2);   // log overhead
  w.body.position.y = Math.abs(Math.cos(w.phase)) * 0.05 * sp;
  w.body.rotation.x = 0.12 * sp;
  w.body.scale.y = 1 + Math.sin(now * 0.0025 + i) * 0.012 * (1 - sp);
  w.head.rotation.z = Math.sin(w.phase * 0.5) * 0.05 * sp;
  w.root.position.set(w.pos.x, groundHeight(w.pos.x, w.pos.z), w.pos.z);
  w.root.rotation.y = w.heading;
  stampTrample(w.pos.x, w.pos.z, 0.55 + 0.1 * sp);
  travelFx(w, dt, sp * w.maxSpeed, 0.6);
  const inWater = waterLevel(uniforms.uTime.value) - groundHeight(w.pos.x, w.pos.z) > 0.01;
  uniforms.uFeet.value[i].set(w.pos.x, w.pos.z, inWater ? 1 : 0, 0.24);
  if (inWater && !reduced) {
    w.splash = (w.splash ?? 0) - dt;
    if (w.splash <= 0) { addRipple(w.pos.x, w.pos.z, sp > 0.3 ? 1 : 0.45); w.splash = sp > 0.3 ? 0.3 : 1.4; }
  }
  uniforms.uWalkers.value[i].set(w.pos.x + shadowOffset.x, w.pos.z + shadowOffset.y, 0.5, 0);
}

// The nearest dry, open spot to (x, z), spiralling outward.
function freeSpot(x, z) {

  return new THREE.Vector3(x, 0, z);
}

// Moves, fades and draws every particle.
function stepFx(dt) {
  const t = uniforms.uTime.value;
  for (const layer of [fxPlain, fxGlow]) {
    let n = 0;
    const keep = [];
    for (const p of layer.list) {
      p.life += dt;
      if (p.life >= p.max) continue;
      const damp = Math.exp(-p.drag * dt);
      p.vx *= damp; p.vz *= damp; p.vy = p.vy * damp - p.grav * dt;
      if (p.flutter) { p.vx += Math.sin(t * 5 + p.max * 9) * p.flutter * dt; p.vz += Math.cos(t * 4 + p.max * 7) * p.flutter * dt; }
      if (p.wind) { const wd = uniforms.uWindDir.value, ws = uniforms.uWind.value * 1.4; p.vx += wd.x * ws * dt; p.vz += wd.y * ws * dt; }
      if (p.spinRate) p.rot += p.spinRate * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.z += p.vz * dt;
      const floor = Math.max(groundHeight(p.x, p.z), waterLevel(t)) + 0.01;
      if (p.y < floor) { p.y = floor; p.vy = 0; p.vx *= 0.5; p.vz *= 0.5; }
      keep.push(p);
      const k = p.life / p.max, fade = Math.min(1, (1 - k) * 3) * Math.min(1, p.life * 10);
      const tw = p.twinkle === undefined ? 1 : 0.6 + 0.4 * Math.sin(t * 7 + p.twinkle);
      layer.pos[n * 3] = p.x; layer.pos[n * 3 + 1] = p.y; layer.pos[n * 3 + 2] = p.z;
      layer.col[n * 4] = p.color.r; layer.col[n * 4 + 1] = p.color.g; layer.col[n * 4 + 2] = p.color.b; layer.col[n * 4 + 3] = p.alpha * fade * tw;
      layer.size[n] = p.size * (1 + p.grow * k);
      layer.spin[n * 2] = p.rot || 0; layer.spin[n * 2 + 1] = p.shape || 0;
      n++;
    }
    layer.list = keep;
    layer.g.setDrawRange(0, n);
    for (const name of ["position", "tint", "size", "spin"]) layer.g.attributes[name].needsUpdate = true;
  }
}

let shadowSlotNext = treeShadowsUsed;

function plantTree(x, z, kind, seed) {

    state: "standing", timer: 0, fall: null, shake: { a: 0, v: 0, axis: V3(1, 0, 0) }, rustleAt: -9, driftIn: Math.random() * 3 };
  attachParts(t, buildTree(kind, seed, t.palette));

// Plant each grove from a jittered grid of spots in shuffled order: off the path, out of the lake, clear of bushes,
// mounts and each other.
{
  const rand = mulberry32(5), spots = [];
  for (let gx = -19; gx <= 19; gx += 3.5) for (let gz = -19; gz <= 19; gz += 3.5) spots.push([gx + (rand() - 0.5) * 2.5, gz + (rand() - 0.5) * 2.5]);
  for (let i = spots.length - 1; i > 0; i--) { const j = Math.floor(rand() * (i + 1)); [spots[i], spots[j]] = [spots[j], spots[i]]; }
  const mountSpots = [[5, 3], [2, 6.5], [13.6, 5.5], ...wild.map((M) => [M.pos.x, M.pos.z])], planted = { autumn: 0, birch: 0, silk: 0 };
  let seed = 900;
  for (const [x, z] of spots) {
    const zone = zoneAt(x, z), grove = GROVES[zone];
    if (planted[zone] >= grove.cap) continue;
    let r = rand() * grove.mix.reduce((a, [, w]) => a + w, 0), kind = grove.mix[0][0];
    for (const [k, w] of grove.mix) if ((r -= w) <= 0) { kind = k; break; }
    const room = TREES[kind].room;
    if (pathDistance(x, z) < PATH_HALF + room * 0.7 || lakeDistance(x, z) < room || blocked(x, z, room * 0.7)) continue;
    if (mountSpots.some(([mx, mz]) => Math.hypot(x - mx, z - mz) < 3.5)) continue;
    if (woodland.trees.some((o) => Math.hypot(x - o.x, z - o.z) < room + o.spec.room)) continue;
    plantTree(x, z, kind, seed++);
    planted[zone]++;
  }
}
function disposeTree(root) {

}
// What can be clicked: standing and growing trees, and stumps (to dig out).
const treeHits = () => woodland.trees.flatMap((t) => t.state === "standing" || t.state === "growing" ? t.hits : t.state === "stump" ? [t.stumpHit] : []);

// ---------- the hero's tools and jobs
// Four tools, picked by the job: the axe fells trees (one click, one swing), the shovel digs out stumps, the sickle
// cuts grass and bushes, and the rake levels a building plot. hero.task is the job in hand; hero.jobs queues more
// (clearing and plot work), and the hero works through them nearest first: cutting and digging, then levelling.

function makeTool(parts) {
  const g = new THREE.Group();
  for (const [geo, hex, x, y, z, rx = 0, ry = 0, rz = 0] of parts) {
    const m = new THREE.Mesh(geo, toon(hex));
    m.position.set(x, y, z);
    m.rotation.set(rx, ry, rz);
    g.add(m);
  }
  g.position.set(0, -0.2, 0);
  g.visible = false;
  hero.armR.add(g);
  return g;
}
const TOOLS = {
  axe: makeTool([
    [new THREE.CylinderGeometry(0.02, 0.022, 0.42, 6), "#8a5a34", 0, -0.17, 0],
    [new THREE.BoxGeometry(0.04, 0.12, 0.15), "#8f98a3", 0, -0.34, -0.05],
    [new THREE.BoxGeometry(0.046, 0.13, 0.03), "#e9eef2", 0, -0.34, -0.135],   // the blade leads with local -z on the downswing
  ]),
  shovel: makeTool([
    [new THREE.CylinderGeometry(0.017, 0.017, 0.62, 6), "#8a5a34", 0, -0.2, 0],
    [new THREE.BoxGeometry(0.11, 0.025, 0.025), "#6d4a2c", 0, 0.1, 0],
    [new THREE.BoxGeometry(0.13, 0.17, 0.018), "#9aa3ad", 0, -0.58, 0],
  ]),
  sickle: makeTool([
    [new THREE.CylinderGeometry(0.02, 0.022, 0.2, 6), "#8a5a34", 0, -0.07, 0],
    [new THREE.TorusGeometry(0.11, 0.012, 4, 14, Math.PI * 1.1), "#dfe5ea", -0.11, -0.18, 0, 0, 0, -Math.PI * 0.1],
  ]),
  rake: makeTool([
    [new THREE.CylinderGeometry(0.016, 0.016, 0.7, 6), "#8a5a34", 0, -0.22, 0],
    [new THREE.BoxGeometry(0.26, 0.03, 0.03), "#6d4a2c", 0, -0.58, 0],
    ...[-0.1, -0.05, 0, 0.05, 0.1].map((x) => [new THREE.BoxGeometry(0.014, 0.012, 0.07), "#9aa3ad", x, -0.59, -0.04]),
  ]),

function showTool(key) { for (const [k, g] of Object.entries(TOOLS)) g.visible = k === key; }

// Arm swing angles (radians; negative is forward and up) through one swing, p = 0..1.
function swingAngle(p) {
  if (p < 0.45) return -0.55 - 2.35 * smooth01(p / 0.45);              // wind up over the head
  if (p < 0.62) return -2.9 + 1.45 * Math.pow((p - 0.45) / 0.17, 2);   // fast strike, speeding up, level at chest height
  return -1.45 + 0.9 * smooth01((p - 0.62) / 0.38);                     // recoil to the ready stance
}
function digAngle(p) {
  if (p < 0.4) return -0.7 - 0.8 * smooth01(p / 0.4);                   // lift the shovel
  if (p < 0.55) return -1.5 + 1.15 * Math.pow((p - 0.4) / 0.15, 2);     // drive it down into the ground
  return -0.35 - 0.55 * smooth01((p - 0.55) / 0.45);                    // lever the earth up
}
// Each job: its tool, swing length (s) and the moment it strikes (fraction of the swing), how close to stand, its pose
// (p = -1 between swings), whether it can still be done, and what a strike does.
const JOB = {
  chop: { tool: "axe", period: 0.42, hit: 0.62, order: 0, reach: (j) => j.tree.footR + 0.45,
    pose: (p) => ({ arm: p < 0 ? -0.55 : swingAngle(p), lean: p > 0.45 && p < 0.8 ? 0.24 : 0.07 }),
    valid: (j) => j.tree.state === "standing", strike: (j) => chopHit(j.tree) },
  dig: { tool: "shovel", period: 0.6, hit: 0.55, order: 0, reach: (j) => j.tree.footR + 0.5,
    pose: (p) => ({ arm: p < 0 ? -0.7 : digAngle(p), lean: p > 0.42 && p < 0.7 ? 0.32 : 0.06 }),
    valid: (j) => j.tree.state === "stump", strike: (j) => digHit(j.tree) },
  // The sickle sweeps across in front, the body twisting from right to left.
  cut: { tool: "sickle", period: 0.4, hit: 0.53, order: 0, reach: (j) => (j.bush ? j.bush.r + 0.3 : 0.45),   // just outside a bush
    pose: (p) => ({ arm: -1.25, armL: -0.35, lean: 0.14, twist: p < 0 ? 0 : p < 0.45 ? 0.85 * smooth01(p / 0.45) : p < 0.6 ? 0.85 - 1.75 * smooth01((p - 0.45) / 0.15) : -0.9 * (1 - smooth01((p - 0.6) / 0.4)) }),
    valid: () => true, strike: (j) => cutHit(j) },
  // The rake reaches out, then pulls back toward the hero.
  level: { tool: "rake", period: 0.55, hit: 0.65, order: 1, reach: () => 0.75,
    pose: (p) => ({ arm: p < 0 ? -0.7 : p < 0.5 ? -0.7 - 0.6 * smooth01(p / 0.5) : -1.3 + 0.9 * smooth01((p - 0.5) / 0.3), lean: p > 0 && p < 0.55 ? 0.28 : 0.1 }),
    valid: (j) => { const t = treeOnCell(j.cell.x, j.cell.z); return !t || t.state === "uprooting"; }, strike: (j) => levelHit(j) },
};
hero.jobs = [];

let hintTimer = null;
function flashHint(text) {
  $("hint").textContent = text;
  clearTimeout(hintTimer);
  hintTimer = setTimeout(syncRideButton, 2600);
}
// Where to stand to work on (x, z) from `reach` away: on the hero's side if that's dry ground, else round about.
function standSpot(x, z, reach) {
  const base = Math.atan2(hero.pos.x - x, hero.pos.z - z);
  for (let k = 0; k < 12; k++) {
    const a = base + (k % 2 ? 1 : -1) * Math.ceil(k / 2) * 0.5, sx = x + Math.sin(a) * reach, sz = z + Math.cos(a) * reach;
    if (groundHeight(sx, sz) > -0.3) return V3(sx, 0, sz);
  }
  return V3(x + reach, 0, z);
}
function startJob(job) {
  hero.task = { ...job, spot: standSpot(job.at.x, job.at.z, JOB[job.kind].reach(job)), working: false, queued: job.swings ?? 1, swing: -1, rest: 0 };
  hero.target = hero.task.spot;
  hero.idle = 0;
  hero.fetch = null;
  if (hero.wantsMount) { hero.wantsMount = false; syncRideButton(); }
  syncJobMarks();
}
// Done with the job in hand: on to the nearest queued one (cutting and digging before levelling), or stop.
function finishJob() {
  hero.task = null;
  hero.body.rotation.y = 0;
  showTool(null);
  if (hero.jobs.length) {
    const order = Math.min(...hero.jobs.map((j) => JOB[j.kind].order));
    let best = -1, bestD = Infinity;
    hero.jobs.forEach((j, k) => {
      const d = Math.hypot(j.at.x - hero.pos.x, j.at.z - hero.pos.z);
      if (JOB[j.kind].order === order && d < bestD) { best = k; bestD = d; }
    });
    startJob(hero.jobs.splice(best, 1)[0]);
  }
  syncJobMarks();
}
function cancelJobs() {
  hero.jobs = [];
  if (hero.task) finishJob();
}
// Starts on the queue if the hero is free; a tree being chopped finishes first.
function runJobs() {
  if (hero.riding || hero.mounting !== null) { hero.jobs = []; syncJobMarks(); flashHint("Get off your mount to work the land."); return; }
  if (!hero.task) finishJob();
  else syncJobMarks();
}

// Each click on a tree is one axe swing (clicks during a swing queue the next); a click on a stump digs it out.
function clickTree(t) {
  if (hero.riding || hero.mounting !== null) { flashHint("Get off your mount to chop trees."); return; }
  if (t.state === "growing") { flashHint("This tree is still growing."); return; }
  const kind = t.state === "stump" ? "dig" : t.state === "standing" ? "chop" : null;
  if (!kind) return;
  if (hero.task && hero.task.tree === t && hero.task.kind === kind) {
    if (kind === "chop" && hero.task.queued < 2) hero.task.queued++;
    return;
  }
  // Whatever was in hand goes back on the queue, to finish after this.
  if (hero.task && hero.task.kind !== "chop" && JOB[hero.task.kind].valid(hero.task)) hero.jobs.push({ ...hero.task, swings: hero.task.queued + (hero.task.swing >= 0 ? 1 : 0) });
  hero.task = null;
  hero.body.rotation.y = 0;
  startJob({ kind, tree: t, at: V3(t.x, 0, t.z), swings: kind === "dig" ? t.digHp : 1 });
}

// Runs inside stepWalker for the hero while it has a job. Returns true when it posed the hero itself.
function stepJob(i, dt) {
  const t = hero.task, J = JOB[t.kind];
  hero.idle = 0;
  if (t.swing < 0 && (!J.valid(t) || (t.queued <= 0 && t.kind !== "chop"))) { finishJob(); return false; }
  if (!t.working) {
    const d = Math.hypot(hero.pos.x - t.spot.x, hero.pos.z - t.spot.z);
    if (d < 0.12 || (!hero.target && d < 0.9)) { t.working = true; hero.target = null; }
    else if (!hero.target) { flashHint("Can't reach that spot."); finishJob(); return false; }
    else { hero.target = t.spot; showTool(J.tool); return false; }
  }
  hero.heading += angleTo(Math.atan2(t.at.x - hero.pos.x, t.at.z - hero.pos.z), hero.heading) * Math.min(1, dt * 14);
  if (t.swing < 0 && t.queued > 0) { t.swing = 0; t.queued--; t.rest = 0; }
  let p = -1;
  if (t.swing >= 0) {
    const before = t.swing / J.period;
    t.swing += dt;
    p = Math.min(1, t.swing / J.period);
    if (before < J.hit && p >= J.hit && J.valid(t)) J.strike(t);
    if (t.swing >= J.period) t.swing = -1;
  } else if ((t.rest += dt) > 3) { finishJob(); return false; }   // put the axe away after a pause
  showTool(J.tool);
  const pose = J.pose(p);
  hero.armR.rotation.set(pose.arm, 0, 0.2);
  hero.armL.rotation.set(pose.armL ?? pose.arm, 0, -0.2);
  hero.legL.rotation.set(0.25, 0, 0);
  hero.legR.rotation.set(-0.2, 0, 0);
  hero.body.rotation.x = pose.lean;
  hero.body.rotation.y = pose.twist ?? 0;
  hero.body.position.y = 0;
  hero.body.scale.y = 1;
  hero.head.rotation.z = 0;
  hero.speed = 0;
  hero.root.position.set(hero.pos.x, groundHeight(hero.pos.x, hero.pos.z), hero.pos.z);
  hero.root.rotation.y = hero.heading;
  uniforms.uFeet.value[i].z = 0;
  uniforms.uWalkers.value[i].set(hero.pos.x + shadowOffset.x, hero.pos.z + shadowOffset.y, 0.5, 0);
  return true;
}

// Rings on the ground where queued work waits: white to cut, brown to dig, sand to level.
const JOB_COLORS = { cut: new THREE.Color("#ffffff"), dig: new THREE.Color("#9a6f48"), level: new THREE.Color("#f0d9a8"), chop: new THREE.Color("#ffffff") };
const jobMarks = new THREE.InstancedMesh(new THREE.RingGeometry(0.3, 0.38, 24).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ transparent: true, opacity: 0.45, depthTest: false, depthWrite: false }), 512);

const _m4 = new THREE.Matrix4();
function syncJobMarks() {

// ---------- clearing: cut grass and bushes, dig out stumps

const bushAt = (x, z, pad = 0) => bushes.find((b) => !b.gone && Math.hypot(x - b.x, z - b.z) < b.r + pad);
// Queues a sickle cut at (x, z) unless it's already bare, can't grow grass, or a cut is queued close by. A spot on a
// bush queues cutting the whole bush.
function queueCut(x, z) {
  const queued = hero.task ? [hero.task, ...hero.jobs] : hero.jobs, b = bushAt(x, z, 0.2);
  if (b) {
    if (!queued.some((j) => j.bush === b)) hero.jobs.push({ kind: "cut", at: V3(b.x, 0, b.z), bush: b, swings: b.hp });
    return;
  }
  if (!landAt(x, z).fertile || landStats(x - 0.6, z - 0.6, x + 0.6, z + 0.6).grow < 0.15) return;
  if (queued.some((j) => j.kind === "cut" && !j.bush && Math.hypot(j.at.x - x, j.at.z - z) < 0.75)) return;

function cutHit(j) {

      color: colors.tip.clone().lerp(colors.mid, Math.random()), size: 0.09, grow: 0, shape: 1, rot: Math.random() * 6, spinRate: (Math.random() - 0.5) * 14, flutter: 1 });

const FX_SOIL = ["#5b3a24", "#7a5234", "#9a6f48"].map((c) => new THREE.Color(c));
function digHit(t) {

      vz: dir.z * (0.6 + Math.random() * 1.6) + (Math.random() - 0.5) * 1.4, life: 0, max: 0.7 + Math.random() * 0.4, grav: 9, drag: 0.4, alpha: 1,

      const a = Math.random() * Math.PI * 2;
      spawnFx(fxPlain, { x: t.x, y: t.y0 + 0.1, z: t.z, vx: Math.cos(a) * (1 + Math.random() * 1.5), vy: 2 + Math.random() * 2.5,

  if (painting) {
    const p = pointAt(e);
    if (!p) return;
    const d = p.distanceTo(painting.last), n = Math.floor(d / 0.5);
    for (let k = 1; k <= n; k++) { const q = painting.last.clone().lerp(p, k / n); queueCut(q.x, q.z); }
    if (n) { painting.last = p; syncJobMarks(); }
    return;
  }
  if (e.pointerType !== "mouse") return;
  const p = pointAt(e);
  if (mode === "plot" && p) moveGhost(p);
  const over = ray.intersectObjects(treeHits(), false)[0], state = over?.object.userData.tree?.state;
  const log = ray.intersectObjects(restingLogs().map((L) => L.mesh), false).length;
  renderer.domElement.style.cursor = log || state === "standing" || state === "stump" ? "pointer" : "";
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (endPaint() || !downAt) return;
  const moved = Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]);
  downAt = null;
  if (moved > 6) return;
  const ground = pointAt(e);
  const treeHit = ray.intersectObjects(treeHits(), false)[0];
  const logs = restingLogs(), logHit = ray.intersectObjects(logs.map((L) => L.mesh), false)[0];
  if (logHit && !(treeHit && treeHit.distance < logHit.distance)) { fetchLog(logs.find((L) => L.mesh === logHit.object)); return; }
  const clicked = !hero.riding && mounts.find((M) => ray.intersectObject(M.root, true).length);
  if (treeHit && treeHit.object.userData.tree && !(clicked && ray.intersectObject(clicked.root, true)[0].distance < treeHit.distance)) {
    clickTree(treeHit.object.userData.tree);
    return;
  }
  if (clicked) { toggleRide(clicked); return; }
  const critter = wild.find((M) => ray.intersectObject(M.root, true).length);
  if (critter) { flashHint(critter.cfg.note); return; }
  if (!ground) return;
  if (mode === "plot") {
    // A click inside a plot picks it; elsewhere it stakes one out. On touch the first tap shows where, a second
    // tap on the same spot stakes it.
    const P = plotAt(ground.x, ground.z);
    if (P) { activePlot = P; syncPlotBar(); return; }
    const before = ghostAt && { ...ghostAt };
    moveGhost(ground);
    if (e.pointerType === "mouse" || (before && before.x0 === ghostAt.x0 && before.z0 === ghostAt.z0 && before.n === ghostAt.n)) placePlot(ghostAt.x0, ghostAt.z0, ghostAt.n);
    return;
  }
  const dest = new THREE.Vector3(clampField(ground.x), 0, clampField(ground.z));
  if (hero.riding) { hero.mount.target = dest; hero.mount.idle = 0; }
  else { cancelJobs(); hero.fetch = null; hero.target = dest; hero.idle = 0; if (hero.wantsMount) { hero.wantsMount = false; syncRideButton(); } }
  marker.position.set(dest.x, 0.05, dest.z);
  marker.material.opacity = 0.9;
  marker.scale.setScalar(1);
});

// ---------- camera follows the hero unless set free

let follow = true;
document.querySelectorAll("[data-cam]").forEach((b) => b.addEventListener("click", () => {
  follow = b.dataset.cam === "follow";
  uniforms.uSeeThrough.value = follow ? 1 : 0;
  document.querySelectorAll("[data-cam]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
}));
camera.position.set(hero.pos.x + 2, 7.5, hero.pos.z - 7);
controls.target.set(hero.pos.x, 0.4, hero.pos.z);
controls.update();

const clock = new THREE.Clock();
const lookAt = new THREE.Vector3();
// One step of the world: everything but drawing. `now` in ms.
function simulate(now, dt) {
  uniforms.uTime.value = reduced ? 0 : now / 1000;
  if (hitStop > 0) { hitStop -= dt; dt *= 0.06; }   // the freeze of an impact frame
  fadeTrample(dt);
  mounts.forEach((M) => stepMount(M, dt, now));
  wild.forEach((M) => stepMount(M, dt, now));
  walkers.forEach((w, i) => stepWalker(w, i, dt, now));
  stepPet(dt);
  stepWoodland(dt);
  stepLand(dt);
  stepPlots(dt);
  stepFx(dt);
  uniforms.uHero.value.copy(hero.pos);
  trTex.needsUpdate = true;
  sun.intensity = 2.3 * uniforms.uSun.value / 1.25;
  hemi.intensity = 0.8 + 0.5 * (1 - uniforms.uStorm.value);
  if (marker.material.opacity > 0) {
    marker.material.opacity = Math.max(0, marker.material.opacity - dt * 1.2);
    marker.scale.multiplyScalar(1 + dt * 0.6);
  }
  if (follow) {
    lookAt.set(hero.pos.x, 0.4, hero.pos.z).sub(controls.target).multiplyScalar(Math.min(1, dt * 4));
    controls.target.add(lookAt);
    camera.position.add(lookAt);
  }
}
let simNow = 0;   // ms; runs ahead of the clock only when gmAdvance steps it
const _shake = new THREE.Vector3();
renderer.setAnimationLoop((now) => {
  const dt = Math.min(clock.getDelta(), 0.05);
  simNow = Math.max(simNow, now);
  simulate(simNow, dt);
  controls.update();
  _shake.set(Math.random() - 0.5, Math.random() - 0.5, Math.random() - 0.5).multiplyScalar(reduced ? 0 : camShake);
  camera.position.add(_shake);
  skyDome.position.copy(camera.position);
  renderer.render(scene, camera);
  camera.position.sub(_shake);
  camShake *= Math.exp(-dt * 10);
  drawImpact(dt);
  stepPops(dt);
});
// Debug hook for slow headless checks: step the world `seconds` ahead at 60 fps without drawing.
window.gmCamera = (p, t) => { follow = false; camera.position.set(...p); controls.target.set(...t); controls.update(); };
window.gmAdvance = (seconds) => { for (let i = 0; i < seconds * 60; i++) { simNow += 1000 / 60; simulate(simNow, 1 / 60); } };
window.gmReady = () => !!blades;
window.gmWalkTo = (x, z) => { hero.target = new THREE.Vector3(x, 0, z); hero.idle = 0; };
window.gmPlaceHero = (x, z) => { hero.pos.set(x, 0, z); hero.target = null; hero.idle = 0; };
window.gmRide = (key = "horse") => toggleRide(mounts.find((m) => m.key === key));
window.gmRideTo = (x, z) => { const M = hero.mount || horse; M.target = new THREE.Vector3(x, 0, z); M.idle = 0; };
window.gmPose = () => ({ arm: hero.armR.rotation.x, task: !!hero.task, working: hero.task?.working, swing: hero.task?.swing, queued: hero.task?.queued, tool: Object.keys(TOOLS).find((k) => TOOLS[k].visible) ?? null });
window.gmTrees = () => woodland.trees.map((t, i) => ({ i, kind: t.kind, palette: t.palette, x: t.x, z: t.z, state: t.state, hp: t.hp }));
window.gmMode = (m) => setMode(m);
window.gmClear = (x, z, r = 1) => clearLand(x, z, r);
window.gmLand = (x, z) => landAt(x, z);
window.gmCut = (pts) => { for (const [x, z] of pts) queueCut(x, z); runJobs(); return hero.jobs.length + (hero.task ? 1 : 0); };
window.gmJobs = () => ({ task: hero.task?.kind ?? null, queued: hero.jobs.length, kinds: hero.jobs.map((j) => j.kind).join(",") });
window.gmPlot = (x0, z0, n = 6) => !!placePlot(x0, z0, n);
window.gmPlots = () => plots.map((P) => ({ x0: P.x0, z0: P.z0, n: P.n, ready: P.ready, ...P.counts }));
window.gmWorkPlot = (k = plots.length - 1) => workPlot(plots[k]);
window.gmBushes = () => bushes.map((b) => ({ x: b.x, z: b.z, gone: b.gone, hp: b.hp }));
window.gmFell = (i) => { const t = woodland.trees[i]; t.hp = 1; chopHit(t); };
window.gmLogs = () => woodland.logs.map((L) => ({ x: L.mesh.position.x, y: L.mesh.position.y, z: L.mesh.position.z, state: L.state, wood: L.wood }));
window.gmPickUp = () => { const L = nearestLog(); if (L) pickUp(L); return !!L; };
window.gmFetch = (k = 0) => { const L = restingLogs()[k]; if (L) fetchLog(L); return !!L; };
window.gmChop = (i) => clickTree(woodland.trees[i]);
window.gmWood = () => woodland.wood;
window.gmBirds = () => woodland.birds.map((b) => `${b.state}@${woodland.trees.indexOf(b.tree)}`).join(",");
window.gmHero = () => ({ x: hero.pos.x, z: hero.pos.z });
window.gmPet = () => ({ x: pet.pos.x, z: pet.pos.z, loaded: !!pet.model, clip: pet.clip });
window.gmMount = (key) => { const M = [...mounts, ...wild].find((m) => m.key === key); return M && { x: M.pos.x, z: M.pos.z, loaded: !!M.model }; };
</script>
